name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Almide
        run: |
          curl -fsSL "https://github.com/almide/almide/releases/download/v0.69.0/almide-linux-x86_64.tar.gz" -o almide.tar.gz
          tar xzf almide.tar.gz --strip-components=1 && sudo mv almide /usr/local/bin/ && almide --version
      # The benches and probes load model weights (weights/*.gguf) that are not
      # in the repo, and there is no src/ entry point or test block, so CI
      # type-checks every .almd file instead of running them.
      - name: Check every .almd file
        run: |
          fail=0
          for f in $(git ls-files '*.almd'); do almide check "$f" > /tmp/out.txt 2>&1 || { echo "::error file=$f::almide check failed"; cat /tmp/out.txt; fail=1; }; done
          exit $fail
